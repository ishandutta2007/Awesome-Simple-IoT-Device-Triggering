<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="350">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="pulse-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes dash {
      to {
        stroke-dashoffset: -40;
      }
    }
    @keyframes pulse-ring {
      0% {
        r: 25px;
        opacity: 0.8;
      }
      100% {
        r: 65px;
        opacity: 0;
      }
    }
    @keyframes float-particle {
      0%, 100% {
        transform: translateY(0px) scale(1);
      }
      50% {
        transform: translateY(-10px) scale(1.15);
      }
    }

    .flow-line {
      stroke: #38BDF8;
      stroke-width: 2.5;
      stroke-dasharray: 8 6;
      animation: dash 2s linear infinite;
      opacity: 0.7;
    }
    .flow-line-alt {
      stroke: #A855F7;
      stroke-width: 2.5;
      stroke-dasharray: 8 6;
      animation: dash 2.5s linear infinite reverse;
      opacity: 0.7;
    }
    .pulse-circle {
      animation: pulse-ring 2.5s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
      transform-origin: center;
    }
    .node-particle {
      animation: float-particle 3s ease-in-out infinite;
    }
    .banner-title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 40px;
      fill: url(#text-grad);
    }
    .banner-sub {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 17px;
      fill: #94A3B8;
    }
    .tag-badge {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #38BDF8;
    }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="350" rx="16" fill="url(#bg-grad)"/>

  <!-- Grid Tech Lines -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <path d="M 0 70 H 1200 M 0 140 H 1200 M 0 210 H 1200 M 0 280 H 1200" />
    <path d="M 150 0 V 350 M 300 0 V 350 M 450 0 V 350 M 600 0 V 350 M 750 0 V 350 M 900 0 V 350 M 1050 0 V 350" />
  </g>

  <!-- Animated Dynamic IoT Flow Lines (Background Layer) -->
  <g>
    <!-- Line 1: Smart Button to MQTT Gateway -->
    <path class="flow-line" d="M 100 240 Q 250 160 400 240 T 700 240" fill="none" />
    <!-- Line 2: Sensor Node to Cloud Engine -->
    <path class="flow-line-alt" d="M 150 100 Q 450 40 750 120 T 1100 100" fill="none" />
    <!-- Line 3: Edge Controller to Cloud -->
    <path class="flow-line" d="M 1050 260 C 900 320 600 300 450 260" fill="none" />
  </g>

  <!-- Animated Nodes (Pulsing & Glowing IoT Elements) -->
  <!-- Button Node (Left) -->
  <g transform="translate(100, 240)">
    <circle class="pulse-circle" cx="0" cy="0" r="30" fill="none" stroke="#38BDF8" stroke-width="2" />
    <circle cx="0" cy="0" r="20" fill="#1E293B" stroke="#38BDF8" stroke-width="3" filter="url(#glow)" />
    <!-- Inner Trigger Icon -->
    <circle cx="0" cy="0" r="10" fill="#0EA5E9" />
  </g>

  <!-- Sensor Node (Top Left) -->
  <g transform="translate(150, 100)" class="node-particle">
    <circle cx="0" cy="0" r="16" fill="#0F172A" stroke="#818CF8" stroke-width="2.5" />
    <polygon points="0,-7 6,5 -6,5" fill="#818CF8" />
  </g>

  <!-- Gateway Node (Top Right) -->
  <g transform="translate(1100, 100)" class="node-particle" style="animation-delay: 1s;">
    <circle cx="0" cy="0" r="18" fill="#0F172A" stroke="#C084FC" stroke-width="2.5" filter="url(#glow)" />
    <rect x="-6" y="-6" width="12" height="12" rx="2" fill="#C084FC" />
  </g>

  <!-- Cloud Trigger Engine Node (Right) -->
  <g transform="translate(1050, 260)">
    <circle class="pulse-circle" cx="0" cy="0" r="35" fill="none" stroke="#F43F5E" stroke-width="2" style="animation-delay: 1.2s;" />
    <circle cx="0" cy="0" r="22" fill="#1E293B" stroke="#F43F5E" stroke-width="3" filter="url(#glow)" />
    <path d="M -8 -4 Q 0 -12 8 -4 Q 12 4 4 6 Q -12 8 -8 -4 Z" fill="#F43F5E" />
  </g>

  <!-- Floating Data Particles -->
  <circle cx="280" cy="190" r="4" fill="#38BDF8" class="node-particle" style="animation-delay: 0.5s;" />
  <circle cx="550" cy="80" r="5" fill="#818CF8" class="node-particle" style="animation-delay: 1.5s;" />
  <circle cx="880" cy="200" r="4.5" fill="#C084FC" class="node-particle" style="animation-delay: 0.8s;" />
  <circle cx="680" cy="285" r="3.5" fill="#F43F5E" class="node-particle" style="animation-delay: 1.8s;" />

  <!-- Center Foreground Content Container (Glassmorphism Backdrop to preserve clarity) -->
  <g transform="translate(600, 175)">
    <!-- Backing Card to ensure title text is 100% crisp & unblocked -->
    <rect x="-430" y="-120" width="860" height="240" rx="20" fill="#0B0F19" fill-opacity="0.84" stroke="#1E293B" stroke-width="2" filter="url(#pulse-glow)" />
    
    <!-- Tag Pill -->
    <rect x="-140" y="-95" width="280" height="30" rx="15" fill="#1E293B" stroke="#38BDF8" stroke-width="1.2" />
    <text x="0" y="-75" text-anchor="middle" class="tag-badge">⚡ SIMPLE IOT DEVICE TRIGGERING</text>

    <!-- Foreground Title -->
    <text x="0" y="-15" text-anchor="middle" class="banner-title">Awesome IoT Device Triggering</text>

    <!-- Foreground Subtitle -->
    <text x="0" y="25" text-anchor="middle" class="banner-sub">Curated SaaS Platforms, Microcontrollers &amp; Self-Hosted Rule Engines</text>
    <text x="0" y="55" text-anchor="middle" class="banner-sub" font-size="14px" fill="#64748B">MQTT • Cellular IoT • ESP32 • Home Assistant • AWS IoT 1-Click • ThingsBoard</text>
  </g>
</svg>
